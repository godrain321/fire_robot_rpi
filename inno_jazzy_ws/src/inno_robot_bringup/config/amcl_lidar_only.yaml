amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.10
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    # amcl_pose_tf_bridge is the sole continuous map->odom broadcaster.
    tf_broadcast: false
    transform_tolerance: 0.5
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 16.0
    laser_min_range: 0.05
    max_beams: 90
    z_hit: 0.85
    z_rand: 0.15
    sigma_hit: 0.20
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.03
    update_min_a: 0.03
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    set_initial_pose: false
    save_pose_rate: 0.5
