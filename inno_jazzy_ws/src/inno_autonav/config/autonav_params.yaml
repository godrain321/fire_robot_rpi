planning_grid_publisher:
  ros__parameters:
    map_frame: map
    publish_rate_hz: 1.0

dynamic_obstacle_layer:
  ros__parameters:
    scan_topic: /scan
    map_frame: map
    base_frame: base_link
    min_range: 0.15
    max_range: 4.0
    obstacle_confirm_count: 3
    persistent_obstacles: false
    obstacle_timeout_sec: 2.5
    inflation_radius: 0.30
    wall_exclusion_radius: 0.25
    cluster_radius_m: 0.50
    person_match_radius_m: 0.75
    person_dedup_radius_m: 0.20
    person_classification_timeout_sec: 0.0
    publish_rate_hz: 5.0

mode3_inspector:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    standoff_distance_m: 1.50
    robot_settle_sec: 2.0
    observation_sec: 5.0
    distance_tolerance_m: 0.60
    minimum_mmwave_samples: 3
    person_positive_samples: 3
    sensor_stale_timeout_sec: 2.0
    update_rate_hz: 10.0

mode4_inspector:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    camera_info_topic: /camera/camera_info
    detection_topic: /camera/person_detections
    standoff_distance_m: 1.50
    robot_settle_sec: 2.0
    observation_sec: 5.0
    minimum_detection_frames: 3
    survivor_positive_frames: 2
    detector_stale_timeout_sec: 2.0
    minimum_confidence: 0.50
    fallback_horizontal_fov_deg: 76.0
    camera_yaw_offset_deg: 0.0
    target_search_radius_m: 1.0
    maximum_candidate_distance_m: 3.0
    maximum_bearing_error_deg: 10.0
    update_rate_hz: 10.0

astar_replanner:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    unknown_is_occupied: true
    replan_rate_hz: 1.0
    path_block_check_radius: 0.20
    start_clearance_radius: 0.18
    allow_diagonal: true
    thermal_grid_topic: /thermal_cost_grid
    thermal_status_topic: /thermal_cost_status
    require_thermal_grid: true
    require_thermal_active: true
    thermal_grid_timeout_sec: 1.0
    # Match factory_v5/config/evacuation.yaml sensor_costmap.
    thermal_cost_weight: 24.0
    thermal_cost_power: 1.5
    fixed_co_ppm: 0.0
    co_safe_ppm: 0.0
    co_blocked_ppm: 1600.0
    co_cost_weight: 8.0
    co_cost_power: 2.0
    simplification_maximum_risk_ratio: 1.0
    simplification_risk_absolute_tolerance: 0.0
    # factory_v5 ReferenceWaypointGraph defaults. Distances remain metres and
    # are converted using each received OccupancyGrid's resolution.
    reference_waypoint_graph_enabled: true
    reference_waypoint_file: ''  # Supplied by the launch waypoint_file argument.
    reference_neighbor_radius_m: 1.5
    reference_connector_search_radius_m: 3.0
    reference_connector_candidate_count: 8
    reference_fallback_to_cell_astar: true
    reference_waypoint_cost_radius_m: 0.10
    reference_waypoint_risk_weight: 1.0
    # False preserves the complete Stage 1/2 static+dynamic+thermal pipeline.
    # True consumes exact final traversal costs from inno_hazard exactly once.
    hazard_belief_enabled: false
    hazard_final_cost_topic: /hazard/final_cost
    hazard_status_topic: /hazard/status

exit_evaluator_node:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    exit_registry_file: ''  # Supplied from the existing semantic_yaml argument.
    reference_waypoint_file: ''  # Supplied from the existing waypoint_file argument.
    hazard_snapshot_topic: /hazard/snapshot
    static_grid_topic: /planning_grid_static
    result_topic: /exit_evaluations
    status_topic: /exit_evaluator/status
    service_name: /evaluate_exits
    exit_neighborhood_radius_m: 1.0
    approach_search_radius_m: 1.0
    reject_blocked_exit: true
    reject_dangerous_exit: true
    reject_path_over_threshold: true
    reject_invalid_cost: true
    usable_confirmation_distance_m: 3.0
    # Negative values encode Simulation's null soft-risk thresholds in ROS params.
    dangerous_accumulated_risk_cost: -1.0
    dangerous_average_risk_cost: -1.0
    dangerous_max_cell_risk_cost: -1.0
    reference_waypoint_graph_enabled: true
    reference_neighbor_radius_m: 1.5
    reference_connector_search_radius_m: 3.0
    reference_connector_candidate_count: 8
    reference_fallback_to_cell_astar: true
    reference_waypoint_cost_radius_m: 0.10
    reference_waypoint_risk_weight: 1.0

evacuation_manager_node:
  ros__parameters:
    enabled: false
    activate_selected_route: false
    risk_first: false
    map_frame: map
    exit_evaluation_service: /evaluate_exits
    plan_service: /plan_evacuation
    planner_goal_topic: /goal_pose
    hazard_revision_topic: /hazard/revision
    plan_topic: /evacuation/plan
    selected_exit_topic: /evacuation/selected_exit
    status_topic: /evacuation/status
    evaluation_service_timeout_s: 30.0
    prefer_confirmed_usable_exit: true
    fallback_to_shortest_reachable_exit: true
    primary_key: path_length_m
    secondary_key: accumulated_risk_cost
    final_tie_breaker: exit_id
    float_tolerance: 1.0e-6

skid_path_follower:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel_auto
    lookahead_distance: 0.35
    goal_tolerance: 0.12
    yaw_tolerance: 0.25
    align_goal_yaw: false
    rotate_in_place_threshold: 0.45
    rotate_exit_threshold: 0.20
    max_linear_speed: 0.06
    max_angular_speed: 0.45
    k_linear: 0.5
    k_angular: 1.2
    emergency_stop_distance: 0.28
    emergency_front_angle_deg: 35.0
    control_rate_hz: 10.0

mission_commander:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    use_source_if_no_tf: false
