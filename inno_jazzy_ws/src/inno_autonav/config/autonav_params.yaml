planning_grid_publisher:
  ros__parameters:
    map_frame: map
    publish_rate_hz: 1.0

dynamic_obstacle_layer:
  ros__parameters:
    scan_topic: /scan
    map_frame: map
    base_frame: base_link
    min_range: 0.15
    max_range: 4.0
    obstacle_confirm_count: 3
    persistent_obstacles: false
    obstacle_timeout_sec: 2.5
    inflation_radius: 0.30
    wall_exclusion_radius: 0.25
    cluster_radius_m: 0.50
    person_match_radius_m: 0.75
    person_dedup_radius_m: 0.20
    person_classification_timeout_sec: 0.0
    publish_rate_hz: 5.0

mode3_inspector:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    standoff_distance_m: 1.50
    robot_settle_sec: 2.0
    observation_sec: 5.0
    distance_tolerance_m: 0.60
    minimum_mmwave_samples: 3
    person_positive_samples: 3
    sensor_stale_timeout_sec: 2.0
    update_rate_hz: 10.0

mode4_inspector:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    camera_info_topic: /camera/camera_info
    detection_topic: /camera/person_detections
    standoff_distance_m: 1.50
    robot_settle_sec: 2.0
    observation_sec: 5.0
    minimum_detection_frames: 3
    survivor_positive_frames: 2
    detector_stale_timeout_sec: 2.0
    minimum_confidence: 0.50
    fallback_horizontal_fov_deg: 76.0
    camera_yaw_offset_deg: 0.0
    target_search_radius_m: 1.0
    maximum_candidate_distance_m: 3.0
    maximum_bearing_error_deg: 10.0
    update_rate_hz: 10.0

astar_replanner:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    unknown_is_occupied: true
    replan_rate_hz: 1.0
    path_block_check_radius: 0.20
    start_clearance_radius: 0.18
    allow_diagonal: true

skid_path_follower:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel_auto
    lookahead_distance: 0.35
    goal_tolerance: 0.12
    yaw_tolerance: 0.25
    align_goal_yaw: false
    rotate_in_place_threshold: 0.45
    rotate_exit_threshold: 0.20
    max_linear_speed: 0.06
    max_angular_speed: 0.45
    k_linear: 0.5
    k_angular: 1.2
    emergency_stop_distance: 0.28
    emergency_front_angle_deg: 35.0
    control_rate_hz: 10.0

mission_commander:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    use_source_if_no_tf: false
